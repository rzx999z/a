<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFIR — KittyFPS</title>
<style>
:root{--bg:#0b0615;--panel:#120a20;--panel2:#170d29;--line:#5930a0;--line2:#8248e8;--txt:#eee5ff;--muted:#9f8bbd;--accent:#9d54ff;--good:#16d67a;--bad:#ff4d67;--warn:#ffc857}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}
button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:46px 40px 1fr 126px}
.top{display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:#0d0718}.brand{font-weight:900;font-size:18px}.brand:before{content:'▣';margin-right:8px}.room{margin-left:auto;color:#bba4dc}.room b{color:#d6b7ff;font-size:17px}.badge{border:1px solid var(--good);color:var(--good);padding:4px 9px;font-size:11px}.ping{color:#a98cc8;font-size:11px}.top button{background:#171027;color:#ddd;border:1px solid #7040b8;padding:5px 11px;cursor:pointer}.top .danger{border-color:var(--bad);color:#fff;background:#b42e46}.bar{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:#0f081b}.url{flex:1;border:1px solid #40246d;padding:6px 10px;color:#c6afe2;white-space:nowrap;overflow:hidden}.url span{color:#d6b7ff}.copy{border:1px solid #6e3ab6;background:#120a20;color:#d6b7ff;padding:6px 12px;cursor:pointer}.main{min-height:0;display:grid;grid-template-columns:200px 1fr}.side{border-right:1px solid var(--line);background:#10081b;display:flex;flex-direction:column;min-width:0}.sideHead{height:40px;padding:11px 10px;border-bottom:1px solid #38205e;font-weight:800}.peers{padding:8px;overflow:auto}.peer{border:1px solid #55318d;background:#160d25;padding:9px;margin-bottom:7px;position:relative}.peer.me{border-color:#7b48c8}.peer.live{border-color:var(--good)}.peerName{font-weight:800;font-size:12px}.peerState{font-size:10px;color:var(--muted);margin-top:3px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#555;margin-right:5px}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.liveTag{display:inline-block;background:#f24a60;color:#fff;padding:2px 5px;font-size:9px;margin-top:7px}.stage{min-width:0;display:flex;flex-direction:column;background:#000}.tabs{height:40px;background:#10081b;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:5px 10px}.tab{border:1px solid #4d2a80;background:#160d25;color:#bca7d6;padding:6px 12px}.tab.active{background:#7135ce;color:#fff;border-color:#9658ee}.status{margin-left:auto;color:#a38abf;font-size:11px}.grid{flex:1;min-height:0;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));grid-auto-rows:minmax(190px,1fr);gap:10px;overflow:auto}.empty{grid-column:1/-1;display:grid;place-items:center;color:#8e75ad;text-align:center}.empty b{color:#c8a9ed}.videoCard{position:relative;background:#080808;border:1px solid #4e2d7d;min-height:190px;overflow:hidden}.videoCard video{width:100%;height:100%;display:block;object-fit:contain;background:#000}.label{position:absolute;left:8px;top:8px;background:#130b20cc;border:1px solid #67409a;padding:5px 8px;font-size:11px;z-index:2}.label.live{border-color:var(--good)}.quality{position:absolute;right:8px;bottom:8px;background:#06110bcc;border:1px solid #178d5b;color:#48e39b;padding:3px 6px;font-size:10px}.bottom{border-top:1px solid var(--line);background:#10081b;display:grid;grid-template-columns:1fr 270px;min-height:0}.chat{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.chatHead{height:31px;padding:8px 10px;border-bottom:1px solid #39215d;font-size:11px}.messages{flex:1;overflow:auto;padding:6px 10px;font-size:11px;color:#c0afd2}.msg{margin:4px 0}.msg b{color:#c995ff}.system{color:#7f6a99;font-style:italic}.composer{height:35px;display:flex;gap:7px;padding:5px 8px}.composer input{flex:1;background:#0a0610;border:1px solid #4b2a79;color:#eee;padding:5px 8px;outline:none}.composer button{width:38px;border:1px solid #7b42c8;background:#6d31cb;color:#fff;cursor:pointer}.controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px}.ctrl{border:1px solid #60368e;background:#170d27;color:#e7d9f7;padding:9px 12px;cursor:pointer}.ctrl.on{border-color:var(--good);color:var(--good)}.ctrl.share{background:#6d31cb;border-color:#9b5be9}.mini{font-size:10px;color:#8e79a6;text-align:center;position:absolute;bottom:4px;left:0;right:0}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}.modal.show{display:grid}.box{width:min(480px,92vw);background:#130a21;border:1px solid #7642bb;padding:18px;box-shadow:0 20px 80px #000}.box h2{margin:0 0 12px}.box input{width:100%;background:#09050e;border:1px solid #583285;color:#fff;padding:10px;margin:5px 0 12px}.box button{border:1px solid #8249ce;background:#6d31cb;color:#fff;padding:9px 14px;cursor:pointer}.log{max-height:220px;overflow:auto;background:#08050c;border:1px solid #382057;padding:8px;font-size:10px;color:#a88fbd;white-space:pre-wrap}
@media(max-width:760px){.main{grid-template-columns:150px 1fr}.bottom{grid-template-columns:1fr}.controls{display:none}.top{gap:7px}.ping{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">DFIR</div><div class="room">SALA <b id="roomCode">----</b></div>
  <div class="badge" id="peerBadge">● 0 PEER</div><div class="ping" id="ping">PING —</div>
  <button id="copyBtn">COPIAR</button><button class="danger" id="leaveBtn">SAIR</button>
</header>
<div class="bar"><div class="url">🔗 <span id="shareUrl"></span></div></div>
<main class="main">
  <aside class="side"><div class="sideHead">◉ CALL <span id="peerCount">0</span></div><div class="peers" id="peers"></div></aside>
  <section class="stage">
    <div class="tabs"><button class="tab active">▣ Fontes (<span id="sourceCount">0</span>)</button><button class="tab">≡ Grade</button><button class="tab">○ Palco</button><div class="status" id="connStatus">conectando…</div></div>
    <div class="grid" id="grid"><div class="empty" id="empty"><div><b>Ninguém transmitindo.</b><br>Use <b>COMPARTILHAR TELA</b> ou <b>CÂMERA</b>.</div></div></div>
  </section>
</main>
<footer class="bottom">
  <section class="chat"><div class="chatHead">▣ CHAT</div><div class="messages" id="messages"></div><div class="composer"><input id="chatInput" placeholder="Mensagem…"><button id="sendChat">➤</button></div></section>
  <section class="controls"><button class="ctrl" id="micBtn">🎙 MIC</button><button class="ctrl share" id="screenBtn">🖥 COMPARTILHAR TELA</button><button class="ctrl" id="camBtn">📷 CÂMERA</button></section>
</footer>
</div>
<div class="modal" id="joinModal"><div class="box"><h2>Entrar na sala</h2><div>Nome</div><input id="nameInput" maxlength="24" placeholder="Seu nome"><div>Código da sala</div><input id="roomInput" maxlength="32" placeholder="C5RS"><div style="margin-bottom:10px">Senha <span style="color:#8d789e">(deixe vazio se não usar)</span></div><input id="passInput" type="password" placeholder="Senha da sala"><button id="joinBtn">ENTRAR</button><div id="joinError" style="color:#ff7082;font-size:11px;margin-top:10px"></div></div></div>
<div class="modal" id="debugModal"><div class="box"><h2>Diagnóstico WebRTC</h2><div class="log" id="debugLog"></div><button id="closeDebug" style="margin-top:10px">FECHAR</button></div></div>
<script type="module">
import {joinRoom, selfId} from 'https://esm.run/@trystero-p2p/torrent@0.25.4';

const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let roomCode=(params.get('sala')||'').trim().toUpperCase();
let myName=localStorage.getItem('dfir_name')||'';
let roomPass=localStorage.getItem('dfir_pass')||'';
let room=null, profile=null, chat=null;
let mediaStream=null, audioTrack=null, videoTrack=null, videoSource=null;
const peers=new Map(), videos=new Map();
const APP_ID='kittyfps-dfir-v2';

function log(s){console.log('[DFIR]',s);$('debugLog').textContent+='['+new Date().toLocaleTimeString()+'] '+s+'\n';$('debugLog').scrollTop=$('debugLog').scrollHeight}
function status(s,cls=''){ $('connStatus').textContent=s; $('connStatus').style.color=cls==='bad'?'#ff657a':cls==='good'?'#38df91':'#a38abf' }
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addMsg(text,system=false){const d=document.createElement('div');d.className='msg'+(system?' system':'');d.innerHTML=escapeHtml(text);$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function setUrl(){const u=location.origin+location.pathname+'?sala='+encodeURIComponent(roomCode);$('shareUrl').textContent=u}
function renderPeers(){
  $('peers').innerHTML='';
  const me=document.createElement('div');me.className='peer me';me.innerHTML='<div class="peerName">'+escapeHtml(myName||'você')+' (VOCÊ)</div><div class="peerState"><span class="dot good"></span>'+ (videoTrack?'transmitindo':'na call')+'</div>';
  if(videoTrack) me.innerHTML+='<div class="liveTag">AO VIVO</div>';
  $('peers').appendChild(me);
  for(const [id,p] of peers){
    const d=document.createElement('div');d.className='peer'+(p.streaming?' live':'');
    d.innerHTML='<div class="peerName">'+escapeHtml(p.name||id.slice(0,8))+'</div><div class="peerState"><span class="dot '+(p.connected?'good':'bad')+'"></span>'+ (p.streaming?'transmitindo':'na call')+'</div>'+(p.streaming?'<div class="liveTag">AO VIVO</div>':'');
    $('peers').appendChild(d);
  }
  $('peerCount').textContent=peers.size+1;$('peerBadge').textContent='● '+peers.size+' PEER'+(peers.size===1?'':'S');
}
function updateEmpty(){ $('empty').style.display=videos.size?'none':'grid'; $('sourceCount').textContent=videos.size }
function addVideo(id,stream,name,local=false){
  let card=videos.get(id);
  if(!card){
    card=document.createElement('div');card.className='videoCard';card.dataset.peer=id;
    const label=document.createElement('div');label.className='label';card.appendChild(label);
    const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=local;card.appendChild(v);
    const q=document.createElement('div');q.className='quality';q.textContent='WebRTC';card.appendChild(q);
    $('grid').appendChild(card);videos.set(id,card);
  }
  const label=card.querySelector('.label');label.textContent=(local?'VOCÊ':(name||'PEER'))+(videoSource==='screen'&&local?' · 🖥':'');label.classList.toggle('live',true);
  const v=card.querySelector('video');if(v.srcObject!==stream){v.srcObject=stream;v.play().catch(()=>{})}
  updateEmpty();
}
function removeVideo(id){videos.get(id)?.remove();videos.delete(id);updateEmpty()}

async function ensureAudio(){
  if(audioTrack && audioTrack.readyState==='live') return;
  const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  audioTrack=s.getAudioTracks()[0];
  if(!mediaStream) mediaStream=new MediaStream();
  mediaStream.addTrack(audioTrack);
  if(room) await room.addTrack(audioTrack,mediaStream,{metadata:{kind:'audio'}});
  $('micBtn').classList.add('on');
  log('microfone conectado');
}
async function startVideo(kind){
  await ensureAudio();
  if(videoTrack) await stopVideo();
  let s;
  if(kind==='screen') s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30,max:60},width:{ideal:1920},height:{ideal:1080},cursor:'always'},audio:false});
  else s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:60}},audio:false});
  videoTrack=s.getVideoTracks()[0];videoSource=kind;
  if(!mediaStream) mediaStream=new MediaStream();
  mediaStream.addTrack(videoTrack);
  await room.addTrack(videoTrack,mediaStream,{metadata:{kind:kind}});
  videoTrack.onended=()=>{if(videoTrack) stopVideo().catch(console.error)};
  addVideo('__me',mediaStream,myName,true);
  renderPeers();
  log('transmissão '+kind+' adicionada');
  status('AO VIVO','good');
}
async function stopVideo(){
  if(!videoTrack) return;
  const old=videoTrack;videoTrack=null;const src=videoSource;videoSource=null;
  try{await room.removeTrack(old)}catch(e){log('removeTrack: '+e.message)}
  try{old.stop()}catch{}
  try{mediaStream?.removeTrack(old)}catch{}
  removeVideo('__me');renderPeers();status('conectado','good');log('transmissão '+src+' encerrada');
}
async function toggleMic(){
  try{await ensureAudio();audioTrack.enabled=!audioTrack.enabled;$('micBtn').classList.toggle('on',audioTrack.enabled);log('mic '+(audioTrack.enabled?'ligado':'mutado'))}
  catch(e){alert('Microfone: '+e.message)}
}

function sendProfile(target){
  if(!profile)return;
  const data={name:myName||'anônimo',streaming:!!videoTrack,source:videoSource||null,t:Date.now()};
  try{profile.send(data,target?{target}:undefined)}catch(e){log('profile send: '+e.message)}
}
function attachPeerStream(stream,id,meta){
  const p=peers.get(id)||{name:id.slice(0,8),connected:true};p.streaming=true;p.source=meta?.kind||'video';peers.set(id,p);
  addVideo(id,stream,p.name,false);renderPeers();log('STREAM recebido de '+id.slice(0,8)+' ['+(meta?.kind||'video')+']');
}

function connect(){
  if(!roomCode){$('joinModal').classList.add('show');return}
  status('entrando…');log('entrando na sala '+roomCode);
  const config={appId:APP_ID};if(roomPass)config.password=roomPass;
  try{
    room=joinRoom(config,roomCode,{onJoinError:(d)=>{log('JOIN ERROR: '+JSON.stringify(d));status('falha WebRTC','bad');alert('Falha ao conectar com o peer. Abra o diagnóstico (F12 > Console) se quiser ver o motivo.\n\n'+(d?.error?.message||d?.error||'conexão WebRTC não estabelecida.'))}});
  }catch(e){status('erro','bad');log('joinRoom: '+e.message);return}
  profile=room.makeAction('profile');chat=room.makeAction('chat');
  profile.onMessage=(data,{peerId})=>{const p=peers.get(peerId)||{connected:true};Object.assign(p,{name:data?.name||p.name||peerId.slice(0,8),streaming:!!data?.streaming,source:data?.source||null,connected:true});peers.set(peerId,p);renderPeers()};
  chat.onMessage=(data,{peerId})=>addMsg((data?.name||peers.get(peerId)?.name||peerId.slice(0,8))+': '+(data?.text||''));
  room.onPeerJoin=async peerId=>{
    log('PEER JOIN '+peerId);peers.set(peerId,{name:'conectando…',connected:true,streaming:false});renderPeers();sendProfile(peerId);
    if(mediaStream){try{await room.addStream(mediaStream,{target:peerId,metadata:{kind:'call'}});log('stream atual enviado para '+peerId.slice(0,8))}catch(e){log('addStream target: '+e.message)}}
    if(videoTrack){try{await room.addTrack(videoTrack,mediaStream,{target:peerId,metadata:{kind:videoSource}})}catch(e){log('addTrack target: '+e.message)}}
    try{const ms=await room.ping(peerId);$('ping').textContent='PING '+ms+'ms'}catch{}
  };
  room.onPeerLeave=peerId=>{const p=peers.get(peerId);addMsg((p?.name||peerId.slice(0,8))+' saiu da sala',true);peers.delete(peerId);removeVideo(peerId);renderPeers();log('PEER LEAVE '+peerId)};
  room.onPeerStream=(stream,peerId,meta)=>attachPeerStream(stream,peerId,meta);
  room.onPeerTrack=(track,stream,peerId,meta)=>{log('TRACK recebido de '+peerId.slice(0,8)+' ['+(meta?.kind||track.kind)+']');if(track.kind==='video')attachPeerStream(stream,peerId,meta)};
  status('conectado','good');addMsg('entrou na sala '+roomCode,true);sendProfile();
  if(mediaStream){room.addStream(mediaStream,{metadata:{kind:'call'}}).catch(e=>log('initial addStream: '+e.message))}
  renderPeers();
}

$('joinBtn').onclick=()=>{myName=$('nameInput').value.trim()||'anônimo';roomCode=$('roomInput').value.trim().toUpperCase();roomPass=$('passInput').value;localStorage.setItem('dfir_name',myName);if(roomPass)localStorage.setItem('dfir_pass',roomPass);else localStorage.removeItem('dfir_pass');$('joinModal').classList.remove('show');setUrl();connect()};
$('screenBtn').onclick=async()=>{try{if(videoSource==='screen')await stopVideo();else await startVideo('screen')}catch(e){log('screen: '+e.message);if(e.name!=='AbortError')alert('Compartilhar tela: '+e.message)}};
$('camBtn').onclick=async()=>{try{if(videoSource==='camera')await stopVideo();else await startVideo('camera')}catch(e){log('camera: '+e.message);alert('Câmera: '+e.message)}};
$('micBtn').onclick=toggleMic;
$('sendChat').onclick=()=>{const i=$('chatInput');const text=i.value.trim();if(!text)return;i.value='';addMsg('Você: '+text);chat?.send({name:myName,text})};
$('chatInput').onkeydown=e=>{if(e.key==='Enter')$('sendChat').click()};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+'?sala='+encodeURIComponent(roomCode));$('copyBtn').textContent='COPIADO';setTimeout(()=>$('copyBtn').textContent='COPIAR',1000)}catch{}};
$('leaveBtn').onclick=()=>{try{room?.leave()}catch{};location.href=location.pathname};
$('closeDebug').onclick=()=>$('debugModal').classList.remove('show');
$('joinModal').addEventListener('dblclick',()=>{});
window.addEventListener('error',e=>log('JS ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+(e.reason?.message||e.reason)));

$('roomCode').textContent=roomCode||'----';$('nameInput').value=myName;$('roomInput').value=roomCode;$('passInput').value=roomPass;setUrl();
if(roomCode&&myName)connect();else $('joinModal').classList.add('show');
</script>
</body>
</html>
